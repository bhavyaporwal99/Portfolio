<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        /* NAVBAR */
        .nav {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            position: relative;
        }

        nav a::after {
            content: "";
            width: 0%;
            height: 2px;
            background: #f5b400;
            position: absolute;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        h1 {
            text-align: center;
            margin: 40px 0;
        }

        /* PROJECT GRID */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* CARD */
        .project-card {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 15px rgba(245, 180, 0, 0.5);
        }

        .project-card h3 {
            margin-bottom: 10px;
        }

        .project-card p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            padding: 8px 15px;
            background: #f5b400;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn:hover {
            background: #ffcc00;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="container nav">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.html">Resume</a>
                <a href="services.html">Services</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- PROJECT SECTION -->
    <section class="container">
        <h1>My Projects</h1>

        <div class="projects">

            <!-- PROJECT 1 -->
            <div class="project-card">
                <h3>Calculator</h3>
                <p>Advanced calculator with theme, history & keyboard support.</p>
                <a href="https://bhavyaporwal99.github.io/Calculator/" target="_blank" class="btn">View Live</a>
            </div>

            

            <!-- PROJECT 2 -->
            <div class="project-card">
                <h3>Coming Soon</h3>
                <p>More projects will be added soon.</p>
                <a href="#" class="btn">View</a>
            </div>

        </div>
    </section>

</body>
</html>
