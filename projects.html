<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peojects - Portfolio</title>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #000;
    color: #fff;
}

/* CONTAINER */
.container {
    width: 90%;
    margin: auto;
}

/* NAVBAR */
.header {
    position: sticky;
    top: 0;
    background: #000;
    z-index: 1000;
}

.nav {
    display: flex;
    justify-content: center;
    padding: 20px 0;
}

nav a {
    margin: 0 20px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    position: relative;
}

/* underline hover */
nav a::after {
    content: "";
    width: 0%;
    height: 2px;
    background: #f5b400;
    position: absolute;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
} 

h1 {
    text-align: center;
        }
    </style>
</head>
