<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills-Portfolio</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #000;
    color: #fff;
}

/* CONTAINER */
.container {
    width: 90%;
    margin: auto;
}

/* NAVBAR */
.header {
    position: sticky;
    top: 0;
    background: #000;
    z-index: 1000;
}

.nav {
    display: flex;
    justify-content: center;
    padding: 20px 0;
}

nav a {
    margin: 0 20px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    position: relative;
}

/* underline hover */
nav a::after {
    content: "";
    width: 0%;
    height: 2px;
    background: #f5b400;
    position: absolute;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

        /* SKILLS */
        .skills {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .skill {
            margin-bottom: 20px;
        }

        .skill p {
            display: flex;
            justify-content: space-between;
        }

        .bar {
            height: 6px;
            background: #333;
            margin-top: 5px;
        }

        .fill {
            height: 100%;
            background: #f5b400;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="container nav">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html" >About</a>
                <a href="resume.html">Resume</a>
                <a href="services.html">Services</a>
                <a href="skills.html" >Skills</a>
                <a href="projects.html" >Projects</a>
                <a href="contact.html" >Contact</a>
            </nav>
        </div>
    </header>

    <!-- SKILLS -->
    <section class="skills">
        <div class="container">
            <h2 class="section-title">My Skills</h2>

            <div class="skill">
                <p>HTML5 <span>85%</span></p>
                <div class="bar">
                    <div class="fill" style="width:85%"></div>
                </div>
            </div>

            <div class="skill">
                <p>CSS3 <span>75%</span></p>
                <div class="bar">
                    <div class="fill" style="width:75%"></div>
                </div>
            </div>

            <div class="skill">
                <p>jQuery <span>0%</span></p>
                <div class="bar">
                    <div class="fill" style="width:0%"></div>
                </div>
            </div>


            <div class="skill">
                <p>SEO <span>20%</span></p>
                <div class="bar">
                    <div class="fill" style="width:20%"></div>
                </div>
            </div>

            <div class="skill">
                <p>MS Word <span>85%</span></p>
                <div class="bar">
                    <div class="fill" style="width:85%"></div>
                </div>
            </div>

            <div class="skill">
                <p>C Language <span>15%</span></p>
                <div class="bar">
                    <div class="fill" style="width:15%"></div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
