<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Portfolio</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        /* NAVBAR */
        .header {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 1000;
        }

        .nav {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            position: relative;
            transition: 0.3s;
        }

        /* underline hover */
        nav a::after {
            content: "";
            width: 0%;
            height: 2px;
            background: #f5b400;
            position: absolute;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }

       

        nav a:hover::after {
            width: 100%;
        }

        /* CONTACT SECTION */
        .contact {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 20px;
        }

        /* CARD */
        .contact-box {
            background: #111;
            padding: 50px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            position: relative;
            transition: 0.4s;

            /* animation */
            animation: fadeUp 1s ease;
        }

        /* hover lift 🔥 */
        .contact-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 40px rgba(176, 4, 244, 0.4);
        }

        /* TITLE */
        .contact-box h2 {
            margin-bottom: 15px;
        }

        /* TEXT */
        .contact-box p {
            margin: 5px 0 15px;
            color: #ccc;
        }

        /* INPUTS */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #333;
            outline: none;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            transition: 0.3s;
        }

        /* focus effect 🔥 */
        input:focus,
        textarea:focus {
            border-color: #f5b400;
            box-shadow: 0 0 10px rgba(245, 180, 0, 0.3);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background: #f5b400;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* button hover */
        button:hover {
            background: #ffcc00;
            transform: scale(1.05);
        }

        /* ================= ANIMATIONS ================= */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= MOBILE ================= */
        @media (max-width: 768px) {
            .contact-box {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="nav">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.html">Resume</a>
                <a href="services.html">Services</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- CONTACT -->
    <section class="contact">
        <div class="contact-box">

            <h2>Contact Me</h2>

            <p>Email: bhavyaporwal99@mail.com</p>


            <form action="https://formspree.io/f/xjykppkq" method="POST">

                <input type="text" name="name" placeholder="Your Name" required>

                <input type="email" name="email" placeholder="Your Email" required>

                <textarea name="message" placeholder="Message" required></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>
    </section>

</body>

</html>
