<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            margin: auto;
        }

        /* NAVBAR */
        .header {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 1000;
        }

        .nav {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            position: relative;
            transition: 0.3s;
        }

        /* underline hover */
        nav a::after {
            content: "";
            width: 0%;
            height: 2px;
            background: #f5b400;
            position: absolute;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }



        nav a:hover::after {
            width: 100%;
        }

        /* ABOUT SECTION */
        .about {
            padding: 80px 10%;
        }

        /* TITLE */
        .about h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 50px;
            position: relative;
            animation: fadeDown 1s ease;
        }

        /* underline */
        .about h1::after {
            content: "";
            width: 80px;
            height: 3px;
            background: #f5b400;
            display: block;
            margin: 10px auto 0;
        }

        /* CONTAINER */
        .about-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            animation: fadeUp 1s ease;
        }

        /* IMAGE */
        .about-img img {
            width: 260px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            transition: 0.4s;
        }

        /* IMAGE HOVER 🔥 */
        .about-img img:hover {
            transform: scale(1.05);

        }

        /* TEXT BOX */
        .about-text {
            max-width: 500px;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            transition: 0.4s;
        }

        /* HOVER CARD */
        .about-text:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(245, 180, 0, 0.3);
        }

        /* DESCRIPTION */
        .about-text p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ccc;
        }

        /* LIST */
        .about-text ul {
            list-style: none;
        }

        .about-text li {
            margin-bottom: 10px;
            font-size: 15px;
        }

        /* highlight labels */
        .about-text li b {
            color: #f5b400;
        }

        /* ================= ANIMATIONS ================= */

        /* fade up */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* fade down */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= MOBILE ================= */
        @media (max-width: 768px) {
            .about-container {
                flex-direction: column;
                text-align: center;
            }

            .about-img img {
                width: 220px;
                height: 260px;
            }
        }
    </style>
</head>

<body>

    <header>

</body>
