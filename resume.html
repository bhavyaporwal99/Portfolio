<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        /* NAVBAR */
        .header {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 1000;
        }

        .nav {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            position: relative;
            transition: 0.3s;
        }

        /* underline hover */
        nav a::after {
            content: "";
            width: 0%;
            height: 2px;
            background: #f5b400;
            position: absolute;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }


        nav a:hover::after {
            width: 100%;
        }

        /* RESUME SECTION */
        .resume {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        /* CARD */
        .resume-box {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 20px rgba(245, 180, 0, 0.3);
            transition: 0.4s;

            /* animation */
            animation: fadeUp 1s ease;
        }

        /* hover effect 🔥 */
        .resume-box:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 40px rgba(245, 180, 0, 0.6);
        }

        .resume-box h1 {
            margin-bottom: 10px;
        }

        .resume-box p {
            color: #ccc;
            margin-bottom: 20px;
        }

        /* BUTTON */
        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border-radius: 6px;
            transition: 0.3s;
        }

        .yellow {
            background: #f5b400;
            color: #000;
            font-weight: bold;
        }

        /* button hover 🔥 */
        .yellow:hover {
            background: #ffcc00;
            transform: scale(1.08);
        }

        /* ENTRY ANIMATION */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="nav">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.html">Resume</a>
                <a href="services.html">Services</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- RESUME -->
    <section class="resume">
        <div class="resume-box">

            <h1>My Resume</h1>
            <p>Download my resume to know more about my skills, education, and experience.</p>

            <a href="assets/Resume.pdf" download class="btn yellow">
                Download Resume
            </a>

        </div>
    </section>

</body>

</html>
